[project]
name = "agenticjournal"
version = "0.1.0"
description = "Cognitive Debugging: An Agentic Journal — backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "chromadb>=0.5",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-chroma>=0.1",
    "ollama>=0.4",
    "networkx>=3.3",
]

[tool.uv]
package = false
